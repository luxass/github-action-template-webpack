ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
onlyBuiltDependencies:
  - "@swc/core"
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0

catalogs:
  runtime:
    "@actions/core": "^3.0.1"

  dev:
    "@swc/core": "^1.16.21"
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    swc-loader: "^0.2.7"
    typescript: "^7.0.2"
    webpack: "^5.112.2"
    webpack-cli: "^7.3.1"

  types:
    "@types/node": "^26.6.6"
